<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with tabs; one column of panels; filters repeat above the trades table. */
:root {
  --bg: #f2f4f8; --surface: #ffffff; --surface-2: #f7f8fb; --line: #e1e5ee; --ink: #101728; --muted: #667089;
  --accent: #3554e8; --accent-soft: #e8ecff; --profit: #0b8f63; --profit-soft: #e2f5ee; --loss: #d93a45; --loss-soft: #fde9ea;
  --flat: #b77a06; --flat-soft: #fbf1d9; --shadow: 0 1px 2px rgba(16,23,40,.05), 0 8px 24px rgba(16,23,40,.05);
  --font: "Manrope", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0e18; --surface: #121828; --surface-2: #171e31; --line: #242d44; --ink: #e7ebf5; --muted: #8d97b0;
  --accent: #7d93ff; --accent-soft: #1c2548; --profit: #34c796; --profit-soft: #10302a; --loss: #ff6b74; --loss-soft: #3a1a20;
  --flat: #e5b045; --flat-soft: #33290f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0a0e18; --surface: #121828; --surface-2: #171e31; --line: #242d44; --ink: #e7ebf5; --muted: #8d97b0;
  --accent: #7d93ff; --accent-soft: #1c2548; --profit: #34c796; --profit-soft: #10302a; --loss: #ff6b74; --loss-soft: #3a1a20;
  --flat: #e5b045; --flat-soft: #33290f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--profit); } .neg { color: var(--loss); } .zero { color: var(--muted); }
.muted { color: var(--muted); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.brand small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; font-weight: 700; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.top .status { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--profit); box-shadow: 0 0 0 3px var(--profit-soft); }

main { padding-block: 18px 48px; display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px 0; }
.panel h2 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
.panel .body { padding: 14px 16px 16px; }
.sub { font-size: 12px; color: var(--muted); font-weight: 600; }

/* Filters */
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.field select { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-weight: 700; color: var(--ink); max-width: 190px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted); user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch i { width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + i { background: var(--accent); } .switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.daynav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.daynav button, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 11px; font-weight: 700; cursor: pointer; }
.daynav button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
.daynav .day { font-weight: 800; min-width: 132px; text-align: center; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi .label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .value { font: 600 24px/1.2 var(--mono); letter-spacing: -.03em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 520px) { .kpi .value { font-size: 19px; } .cal button { padding: 4px; min-height: 46px; } .cal button .p { font-size: 10px; } }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* Now strip */
.now { display: flex; gap: 10px; flex-wrap: wrap; }
.nowcard { flex: 1 1 280px; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px; padding: 10px 14px; background: var(--surface); min-width: 0; }
.nowcard.live { border-left-color: var(--profit); } .nowcard.pending { border-left-color: var(--flat); }
.nowcard b { font-weight: 800; } .nowcard .num { font-size: 13px; }

/* Chart + calendar */
.chart { width: 100%; height: 220px; display: block; }
.empty { color: var(--muted); text-align: center; padding: 28px 12px; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dow { font-size: 10px; font-weight: 800; letter-spacing: .06em; color: var(--muted); text-align: center; text-transform: uppercase; padding-bottom: 2px; }
.cal button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; min-height: 52px; padding: 5px 6px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.cal button .d { font-size: 11px; font-weight: 700; color: var(--muted); }
.cal button .p { font: 600 11.5px var(--mono); white-space: nowrap; overflow: hidden; }
.cal button.win { background: var(--profit-soft); border-color: transparent; } .cal button.win .p { color: var(--profit); }
.cal button.loss { background: var(--loss-soft); border-color: transparent; } .cal button.loss .p { color: var(--loss); }
.cal button.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal button.out { visibility: hidden; }
.calhead { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* Tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
th { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.r { text-align: right; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
.pill.tp { background: var(--profit-soft); color: var(--profit); } .pill.sl { background: var(--loss-soft); color: var(--loss); }
.pill.be { background: var(--flat-soft); color: var(--flat); } .pill.tag { background: var(--accent-soft); color: var(--accent); }
.pill.grey { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.side { font-weight: 800; } .side.long { color: var(--profit); } .side.short { color: var(--loss); }
tr.click { cursor: pointer; } tr.selrow td { background: var(--accent-soft); }
.bar { display: inline-block; vertical-align: middle; width: 64px; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; margin-left: 8px; }
.bar span { display: block; height: 100%; border-radius: 4px; }

/* Logs */
.log { font: 500 12.5px/1.6 var(--mono); max-height: 460px; overflow: auto; border-top: 1px solid var(--line); }
.log div { display: flex; gap: 12px; padding: 4px 16px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.log time { color: var(--muted); flex: none; }
.log span { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.log .alert span { color: var(--accent); font-weight: 600; } .log .order span { font-weight: 600; }
.log .tp span { color: var(--profit); font-weight: 600; } .log .sl span { color: var(--loss); font-weight: 600; }
.log .be span { color: var(--flat); font-weight: 600; } .log .quiet span { color: var(--muted); }

/* Gate */
#gate { display: none; }
html.locked #app { display: none; }
html.locked #gate { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
#gate form { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
#gate h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
#gate input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 11px 12px; }
#gate button { border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 11px; font-weight: 800; cursor: pointer; }
#gate .err { color: var(--loss); font-size: 12px; min-height: 16px; font-weight: 700; }
.sample { background: var(--flat-soft); color: var(--flat); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>
(function () {
  var LIVE = /github\.io$/.test(location.hostname), ok = false;
  try { ok = localStorage.getItem("v2b-gate") === "c72f829bb31cebe39970b40b19e3b49a81843b7b684c9f1e7a8e7c8b5350754b" && !!localStorage.getItem("v2b-key"); } catch (e) {}
  if (LIVE && !ok) document.documentElement.classList.add("locked");
})();
</script>
</head>
<body>
<div id="gate">
  <form id="gateForm">
    <h1>Trade Journal</h1>
    <div class="muted">Enter the page password to unlock trades, logs and accounts.</div>
    <input id="gatePw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button type="submit">Unlock</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>

<div id="app">
  <div class="top"><div class="wrap">
    <div class="brand"><span class="mark" id="mark">V</span><span><span id="traderName">Trader</span><small>Trade journal</small></span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="dashboard" aria-selected="true">Dashboard</button>
      <button role="tab" data-tab="logs" aria-selected="false">Logs</button>
      <button role="tab" data-tab="accounts" aria-selected="false">Accounts</button>
    </div>
    <div class="status"><span class="dot" id="liveDot"></span><span id="updated">Loading…</span></div>
  </div></div>

  <main class="wrap">
    <div class="sample" id="sampleNote" hidden>Sample data. This copy is not connected to NinjaTrader.</div>

    <!-- Dashboard -->
    <section id="tab-dashboard" style="display:flex;flex-direction:column;gap:16px">
      <div class="filters" data-filters>
        <div class="daynav"><button data-day="-1" aria-label="Previous day">‹</button><span class="day" data-daylabel></span><button data-day="1" aria-label="Next day">›</button><button data-day="today">Today</button></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="now" id="now" hidden></div>
      <div class="grid2">
        <div class="panel"><header><h2>Day P&amp;L curve</h2><span class="sub" id="curveSub"></span></header><div class="body"><div id="curve"></div></div></div>
        <div class="panel"><header><h2 id="calTitle">Month</h2><div class="calhead"><span class="num" id="calTotal"></span><button class="btn" id="calPrev" aria-label="Previous month">‹</button><button class="btn" id="calNext" aria-label="Next month">›</button></div></header><div class="body"><div class="cal" id="cal"></div></div></div>
      </div>
      <div class="panel"><header><h2>By account</h2><span class="sub" id="acctSub"></span></header><div class="body" style="padding:10px 0 0"><div class="scroll" id="byAcct"></div></div></div>
      <div class="panel">
        <header><h2>Trades</h2><span class="sub" id="tradesSub"></span>
          <div class="filters" data-filters style="margin-left:auto"><button class="btn" id="csvBtn">Download CSV</button></div></header>
        <div class="body" style="padding:12px 0 0"><div class="scroll" id="trades"></div></div>
      </div>
    </section>

    <!-- Logs -->
    <section id="tab-logs" hidden style="flex-direction:column;gap:16px">
      <div class="filters"><div class="daynav" style="margin-left:0"><button data-day="-1" aria-label="Previous day">‹</button><span class="day" data-daylabel></span><button data-day="1" aria-label="Next day">›</button><button data-day="today">Today</button></div></div>
      <div class="panel"><header><h2>Auto trades log</h2><span class="sub" id="autoSub"></span>
        <label class="switch" style="margin-left:auto"><input type="checkbox" id="autoKey" checked><i></i>Orders and results only</label></header>
        <div class="body" style="padding:12px 0 0"><div class="log" id="logAuto"></div></div></div>
      <div class="panel"><header><h2>Manual trades log</h2><span class="sub" id="manualSub"></span>
        <label class="switch" style="margin-left:auto"><input type="checkbox" id="manualKey"><i></i>Hide alerts I skipped</label></header>
        <div class="body" style="padding:12px 0 0"><div class="log" id="logManual"></div></div></div>
    </section>

    <!-- Accounts -->
    <section id="tab-accounts" hidden style="flex-direction:column;gap:16px">
      <div class="filters" data-filters data-noStrategy></div>
      <div id="acctTables" style="display:flex;flex-direction:column;gap:16px"></div>
    </section>
  </main>
</div>

<script>
"use strict";
const LIVE = /github\.io$/.test(location.hostname);
const OWNER = "odiyo-vimo", REPO = "trades", BRANCH = "main", HASH = "c72f829bb31cebe39970b40b19e3b49a81843b7b684c9f1e7a8e7c8b5350754b";
const segs = location.pathname.split("/").filter((s) => s && !/\.html?$/i.test(s));
const TRADER = LIVE ? (segs[1] || "vimal") : "vimal";
if (LIVE && segs.length > 2) location.replace(`/${segs[0]}/${segs[1]}/`);   // old /v2b/ and /manual/ links
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseDay = (s) => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const fmtDay = (s) => parseDay(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const num = (v) => (v === null || v === undefined || v === "" || !isFinite(Number(v)) ? null : Number(v));
const money = (v, dp = 2) => (v === null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }));
const short = (v) => (Math.abs(v) >= 1000 ? (v > 0 ? "+" : "−") + "$" + (Math.abs(v) / 1000).toFixed(1) + "k" : money(v, 0));
const usd = (v) => (v === null ? "–" : "$" + v.toLocaleString("en-US", { maximumFractionDigits: 0 }));
const cls = (v) => (v > 0 ? "pos" : v < 0 ? "neg" : "zero");
const isSim = (name) => /^(sim|playback)/i.test(String(name || ""));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- password gate + decryption ---------- */
$("gateForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("gatePw").value.toLowerCase().replace(/\s+/g, ""), err = $("gateErr");
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  if ([...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("") !== HASH) { err.textContent = "Wrong password. Try again."; $("gatePw").select(); return; }
  err.textContent = "Unlocking…";
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("v2b-trades-v1"), iterations: 200000 }, base, 512));
  let s = ""; bits.forEach((b) => (s += String.fromCharCode(b)));
  store.set("v2b-gate", HASH); store.set("v2b-key", btoa(s));
  location.reload();
});
let cryptoKeys = null;
async function unseal(text) {
  if (text === null || !text.startsWith("V2BENC1:")) return text;
  if (!cryptoKeys) {
    const raw = Uint8Array.from(atob(store.get("v2b-key", "")), (c) => c.charCodeAt(0));
    if (raw.length !== 64) throw new Error("no key");
    cryptoKeys = { enc: await crypto.subtle.importKey("raw", raw.slice(0, 32), "AES-CBC", false, ["decrypt"]),
                   mac: await crypto.subtle.importKey("raw", raw.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]) };
  }
  const all = Uint8Array.from(atob(text.slice(8).trim()), (c) => c.charCodeAt(0));
  const body = all.slice(0, all.length - 32), mac = all.slice(all.length - 32);
  if (!(await crypto.subtle.verify("HMAC", cryptoKeys.mac, mac, body))) { try { localStorage.removeItem("v2b-key"); } catch {} location.reload(); throw new Error("bad key"); }
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv: body.slice(0, 16) }, cryptoKeys.enc, body.slice(16)));
}
async function readFile(path) {
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${TRADER}/${path}?t=${Date.now()}`, { cache: "no-store" });
    return res.ok ? await unseal(await res.text()) : null;
  } catch { return null; }
}
async function readJson(path) { const t = await readFile(path); try { return t ? JSON.parse(t) : null; } catch { return null; } }

/* ---------- data ---------- */
// New layout: data/ and logs/auto|manual/ (uploaded by the TradeTracker add-on). The older
// manual/ and v2b/ folders are still read so nothing is lost while NinjaTrader is being updated.
const SOURCES = ["data", "manual/data", "v2b/data"];
const S = { day: today(), month: today().slice(0, 7), strategy: store.get("tj-strategy", "all"), account: store.get("tj-account", "all"),
            sim: store.get("tj-sim", "1") === "1", tab: "dashboard", dates: new Set(), days: new Map(), accounts: null, logs: {}, updated: null };

function normalise(t, src) {
  const account = t.account || t.nt_account || "Account";
  let strategy = t.strategy || (src === "v2b/data" ? "V2B Auto" : "Manual");
  return { ...t, account, strategy, pnl: num(t.pnl) ?? 0, key: `${t.entry_time}|${account}|${t.direction}` };
}
async function loadDay(date, force) {
  if (!force && S.days.has(date)) return S.days.get(date);
  let trades;
  if (!LIVE) trades = sampleDay(date);
  else {
    const files = await Promise.all(SOURCES.map((s) => readJson(`${s}/${date}.json`)));
    const map = new Map();
    files.forEach((f, i) => (f && f.trades || []).forEach((raw) => {
      const t = normalise(raw, SOURCES[i]), old = map.get(t.key);
      if (!old) map.set(t.key, t);
      else if (SOURCES[i] === "v2b/data") map.set(t.key, { ...t, ...old, strategy: /^manual$/i.test(old.strategy) ? "V2B Auto" : old.strategy, stop: t.stop, target: t.target, r: t.r });

function stats(list) {
  list = list.filter((t) => !t.open);   // open trades are listed but not counted until they close
  const s = { n: list.length, pnl: 0, w: 0, l: 0, be: 0, gw: 0, gl: 0 };
  list.forEach((t) => { s.pnl += t.pnl; if (t.result === "TP" || (t.result !== "SL" && t.result !== "BE" && t.pnl > 0)) { s.w++; s.gw += Math.max(0, t.pnl); } else if (t.result === "SL" || (t.result !== "BE" && t.pnl < 0)) { s.l++; s.gl += Math.max(0, -t.pnl); } else s.be++; });
  s.win = s.w + s.l ? Math.round((s.w / (s.w + s.l)) * 100) : null;

}

/* ---------- logs ---------- */
function classify(m) {
  if (/^ALERT:/.test(m)) return "alert";
  if (/^(PENDING ORDER (PLACED|MOVED)|FILLED|MANUAL ENTRY|AUTO ENTRY|ENTRY):/.test(m) || /^(LONG|SHORT) \d/.test(m) || /^Entry filled/.test(m)) return "order";
  if (/^(WINNER|TP1 HIT):/.test(m) || /Trade closed: TP/.test(m) || /^TP1 hit/.test(m)) return "tp";
  if (/^LOSER:/.test(m) || /Trade closed: SL/.test(m)) return "sl";
  if (/^(BREAK-EVEN|STOP MOVED TO BREAK-EVEN):/.test(m) || /Trade closed: BE|^Break-even/.test(m)) return "be";
  if (/^PENDING ORDER CANCELLED|cancel/i.test(m)) return "be";
  return "quiet";
}
function logLines(text) { return text.split(/\r?\n/).map((l) => l.match(/^\S+ (\d\d:\d\d(?::\d\d)?)\s+(.*)$/)).filter(Boolean).map((m) => ({ time: m[1], msg: m[2], kind: classify(m[2]) })); }
function renderLog(el, sub, lines, emptyMsg) {
  sub.textContent = `${fmtDay(S.day)} · ${lines.length} line${lines.length === 1 ? "" : "s"}`;
  el.innerHTML = lines.length ? lines.slice().reverse().map((l) => `<div class="${l.kind}"><time>${l.time}</time><span>${esc(l.msg)}</span></div>`).join("") : `<div class="empty" style="display:block">${emptyMsg}</div>`;
}

  const lg = S.logs[S.day] || { auto: "", manual: "" };
  let a = logLines(lg.auto), m = logLines(lg.manual);
  if ($("autoKey").checked) a = a.filter((l) => l.kind !== "quiet");
  if ($("manualKey").checked) m = m.filter((l) => l.kind !== "alert" && l.kind !== "quiet");
  renderLog($("logAuto"), $("autoSub"), a, "No auto-trade log for this day. It appears here when the V2B strategy is running.");
  renderLog($("logManual"), $("manualSub"), m, "No manual-trade log for this day. Alerts, orders you take and trades you place by hand appear here.");
}

// Current alert / order, from today's manual log.
function renderNow() {
  const box = $("now"), lg = S.logs[today()];
  if (S.day !== today() || !lg) { box.hidden = true; return; }
  let alert = null, order = null, m;
  logLines(lg.manual).forEach(({ time, msg }) => {
    if ((m = msg.match(/^ALERT: (LONG|SHORT) (\d+) @ ([\d.]+) \| SL ([\d.]+) \| (?:TP1 [\d.]+ \(\d+\) \| )?TP2? ([\d.]+).*?until (\d\d:\d\d)/))) alert = { side: m[1], qty: m[2], price: m[3], sl: m[4], tp: m[5], until: m[6], time };
    else if ((m = msg.match(/^PENDING ORDER (?:PLACED|MOVED): (LONG|SHORT) (\d+) @ ([\d.]+) \| SL ([\d.]+) \| (?:TP1 [\d.]+ \(\d+\) \| )?TP2? ([\d.]+)/))) order = { state: "pending", side: m[1], qty: m[2], price: m[3], sl: m[4], tp: m[5], time };
    else if ((m = msg.match(/^(?:FILLED|MANUAL ENTRY|ENTRY): (LONG|SHORT) (\d+) @ ([\d.]+)(?: \| SL ([\d.]+|none) \| (?:TP1 [\d.]+ \(\d+\) \| )?TP2? ([\d.]+|none))?/))) order = { state: "live", side: m[1], qty: m[2], price: m[3], sl: m[4] || (order && order.sl), tp: m[5] || (order && order.tp), time };
    else if (/^(WINNER|LOSER|BREAK-EVEN|PENDING ORDER CANCELLED):/.test(msg)) order = null;
  });

    (order ? card(order.state, order.state === "live" ? "Trade open" : "Order waiting to fill", order, `since ${order.time}`) : "");
  box.hidden = !alert && !order;

          <td class="r num">${room === null ? "–" : usd(room) + (pct !== null ? meter(pct, pct < 0.25 ? "var(--loss)" : pct < 0.5 ? "var(--flat)" : "var(--accent)") : "")}</td>`}
          <td class="r num ${cls(d.pnl)}">${d.n ? money(d.pnl, 0) : "–"}</td><td class="r num">${t.n}</td><td class="r num">${t.win === null ? "–" : t.win + "%"}</td></tr>`;

  };
  const g = (f) => list.filter(f).sort((x, y) => String(x.key).localeCompare(String(y.key)));
  const html = table("Funded", g((a) => a.type === "Funded" || a.type === "Live")) + table("Evaluation", g((a) => a.type === "Evaluation")) + table("Sim", g((a) => a.type === "Sim"), true);
  $("acctTables").innerHTML = (html || `<div class="panel"><div class="empty">No accounts for the current filters. Accounts with a balance appear here within a minute of NinjaTrader connecting.</div></div>`) +
    (S.accounts && S.accounts.updated ? `<div class="sub">Balances updated ${esc(S.accounts.updated.slice(11, 16))} on ${fmtDay(S.accounts.updated.slice(0, 10))}. Trade counts cover the months you have opened on the dashboard. Click an account to see its trades.</div>` : "");
  bindAcctRows($("acctTables"));
}

/* ---------- navigation ---------- */
function render() {
  buildFilters();
  document.querySelectorAll("[data-daylabel]").forEach((n) => (n.textContent = S.day === today() ? "Today, " + fmtDay(S.day) : fmtDay(S.day)));
  renderKpis(); renderNow(); renderCurve(); renderCal(); renderByAcct(); renderTrades(); renderLogs(); renderAccounts();
  const up = S.accounts && S.accounts.updated && (!S.updated || S.accounts.updated > S.updated) ? S.accounts.updated : S.updated;
  $("updated").textContent = !LIVE ? "Sample data" : up ? `Updated ${up.slice(11, 16)}${up.slice(0, 10) === today() ? "" : " on " + fmtDay(up.slice(0, 10))}` : "No data yet";
  $("liveDot").classList.toggle("on", !!up && up.slice(0, 10) === today() && (Date.now() - new Date(up.replace(" ", "T")).getTime()) < 5 * 60000);
}
function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ["dashboard", "logs", "accounts"].forEach((t) => { const el = $("tab-" + t); el.hidden = t !== tab; el.style.display = t === tab ? "flex" : ""; });
  render();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
async function setDay(date) {
  S.day = date; S.month = date.slice(0, 7);
  if (S.dates.has(date) || date === today()) await loadDay(date);
  await Promise.all([loadMonth(S.month), loadLogs(date)]);
  render();
}
document.querySelectorAll("[data-day]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.day === "today") return setDay(today());
  const known = [...S.dates, today()].sort(), dir = +b.dataset.day;
  const next = dir < 0 ? known.filter((d) => d < S.day).pop() : known.find((d) => d > S.day);
  if (next) setDay(next);
}));
async function shiftMonth(d) { const [y, m] = S.month.split("-").map(Number), x = new Date(y, m - 1 + d, 1); S.month = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; await loadMonth(S.month); render(); }
$("calPrev").addEventListener("click", () => shiftMonth(-1)); $("calNext").addEventListener("click", () => shiftMonth(1));

async function refresh() {
  if (!LIVE || document.hidden) return;
  const t = today();
  await Promise.all([loadIndex(), loadAccounts(), loadDay(t, true), loadLogs(t, true)]);
  if (S.day !== t) await loadLogs(S.day);
  render();
}
async function start() {
  $("traderName").textContent = TRADER.charAt(0).toUpperCase() + TRADER.slice(1); $("mark").textContent = TRADER.charAt(0).toUpperCase();
  document.title = `${TRADER.charAt(0).toUpperCase() + TRADER.slice(1)} · Trade Journal`;
  $("sampleNote").hidden = LIVE;
  await Promise.all([loadIndex(), loadAccounts()]);
  if (!S.dates.has(S.day)) { const last = [...S.dates].sort().pop(); if (last && !LIVE) S.day = last; }
  S.month = S.day.slice(0, 7);
  await Promise.all([loadDay(S.day), loadMonth(S.month), loadLogs(S.day), loadLogs(today())]);
  render();
  setInterval(refresh, 10000);
}

/* ---------- sample data (shown when the page is not on GitHub) ---------- */
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const SAMPLE_ACCTS = [["Apex PA 005", 12], ["Apex PA 007", 12], ["Apex PA 008", 12], ["Apex PA 009", 12], ["Apex PA 013", 4], ["Apex 086", 6]];
function sampleDates() { const out = [], d = new Date(); for (let i = 0; i < 45; i++) { const x = new Date(d); x.setDate(d.getDate() - i); if (x.getDay() % 6) out.push(ymd(x)); } return out; }
function sampleDay(date) {
  const r = rng(+date.replace(/-/g, "")), out = [], add = (h, m, acct, strat, side, qty, entry, pts, res, by) => {
    const e = `${date} ${pad(h)}:${pad(m)}:${pad(Math.floor(r() * 60))}`, x = `${date} ${pad(h)}:${pad(Math.min(59, m + 2 + Math.floor(r() * 9)))}:${pad(Math.floor(r() * 60))}`;
    out.push(normalise({ entry_time: e, exit_time: x, account: acct, strategy: strat, direction: side, contracts: qty, entry, exit: +(entry + (side === "Long" ? pts : -pts)).toFixed(2), pnl_points: pts, pnl: +(pts * 2 * qty).toFixed(2), result: res, exit_order: by, session: h < 7 ? "Asia" : h < 13 ? "London" : "NY AM", instrument: "MNQ 12-26" }, "data"));
  };
  const n = 2 + Math.floor(r() * 2);
  for (let i = 0; i < n; i++) {
    const h = 8 + Math.floor(r() * 8), m = Math.floor(r() * 50), side = r() > 0.5 ? "Long" : "Short", entry = 27000 + Math.round(r() * 1200), roll = r();
    const res = roll < 0.42 ? "TP" : roll < 0.8 ? "SL" : "BE", pts = res === "TP" ? 20 + Math.round(r() * 14) : res === "SL" ? -(11 + Math.round(r() * 5)) : 0.25;
    SAMPLE_ACCTS.forEach(([a, q], k) => { if (k < 5 || r() > 0.5) add(h, m, a, "V2B", side, q, entry, pts, res, res === "TP" ? "Profit target" : "Stop loss"); });
  }
  for (let i = 0; i < 2; i++) { const side = r() > 0.5 ? "Long" : "Short", res = r() < 0.45 ? "TP" : "SL"; add(1 + i * 3, Math.floor(r() * 50), "Sim101", "V2B Auto", side, 5, 27300 + Math.round(r() * 400), res === "TP" ? 24 : -13, res, res === "TP" ? "Profit target" : "Stop loss"); }
  if (r() > 0.4) { const res = r() < 0.55 ? "TP" : "SL"; add(14, 35, "Apex PA 013", "Manual", "Short", 1, 27845.25, res === "TP" ? 53.5 : -17, res, res === "TP" ? "Target1" : "Stop1"); }
  return out;
}
function sampleAccounts() {
  const mk = (key, firm, ends, type, start, target, dd, bal, peak) => ({ key, firm, ends, type, connected: true, start_balance: start, profit_target: target, max_trailing_dd: dd, net_liq: bal, cash: bal, nt_trailing_dd: null, peak_balance: peak });
  return { updated: `${today()} ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}:00`, accounts: [
    mk("Apex PA 005", "Apex", "005", "Funded", 150000, 9000, 5000, 153420, 154100), mk("Apex PA 007", "Apex", "007", "Funded", 150000, 9000, 5000, 152180, 153300),
    mk("Apex PA 008", "Apex", "008", "Funded", 150000, 9000, 5000, 151240, 152900), mk("Apex PA 009", "Apex", "009", "Funded", 150000, 9000, 5000, 149310, 152050),
    mk("Apex PA 013", "Apex", "013", "Funded", 50000, 3000, 2500, 50760, 51120), mk("Apex 086", "Apex", "086", "Evaluation", 100000, 6000, 3000, 102350, 102900),
    { key: "Sim101", firm: "", ends: "101", type: "Sim", connected: true, net_liq: 99547, cash: 99547 } ] };
}
function sampleLogs(date) {
  const v = sampleDay(date), auto = [], manual = [], f = (x) => Number(x).toFixed(2);
  v.filter((t) => t.strategy === "V2B Auto").forEach((t) => {
    const S2 = t.direction.toUpperCase(), sl = f(t.entry + (S2 === "LONG" ? -13 : 13)), tp = f(t.entry + (S2 === "LONG" ? 24 : -24));
    auto.push(`${t.entry_time.slice(0, 16)}:00  No signal: NQ 12-26 volume 2738 <= previous 3433`);
    auto.push(`${t.entry_time}  ENTRY: ${S2} ${t.contracts} @ ${f(t.entry)} | SL ${sl} | TP ${tp} | Sim101 | V2B Auto`);
    auto.push(`${t.exit_time}  ${t.result === "TP" ? "WINNER" : "LOSER"}: ${S2} ${t.contracts} | entry ${f(t.entry)} | exit ${f(t.exit)} (${t.exit_order}) | SL ${sl} | TP ${tp} | ${money(t.pnl).replace("−", "-")} | Sim101 | V2B Auto`);
  });
  const seen = new Set();
  v.filter((t) => t.strategy !== "V2B Auto").forEach((t) => {
    const k = t.entry_time.slice(0, 16) + t.strategy; if (seen.has(k)) return; seen.add(k);
    const S2 = t.direction.toUpperCase(), sl = f(t.entry + (S2 === "LONG" ? -14 : 14)), tp = f(t.entry + (S2 === "LONG" ? 28 : -28)), lv = `${S2} ${t.contracts} @ ${f(t.entry)} | SL ${sl} | TP ${tp}`;
    if (t.strategy === "V2B") { manual.push(`${t.entry_time.slice(0, 16)}:00  ALERT: ${lv} | risk $300 | until ${t.exit_time.slice(11, 16)}`); manual.push(`${t.entry_time.slice(0, 16)}:20  PENDING ORDER PLACED: ${lv} | risk $300`); manual.push(`${t.entry_time}  FILLED: ${lv}`); }
    else manual.push(`${t.entry_time}  MANUAL ENTRY: ${lv} | ${t.account} | Manual`);
    manual.push(`${t.exit_time}  ${t.result === "TP" ? "WINNER" : t.result === "SL" ? "LOSER" : "BREAK-EVEN"}: ${S2} ${t.contracts} | entry ${f(t.entry)} | exit ${f(t.exit)} (${t.exit_order}) | SL ${sl} | TP ${tp} | ${money(t.pnl).replace("−", "-")} | ${t.account} | ${t.strategy}`);
  });
  return { auto: auto.sort().join("\n"), manual: manual.sort().join("\n") };
}
if (!document.documentElement.classList.contains("locked")) start();
